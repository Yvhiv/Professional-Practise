<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PP Revision Hub</title>
<style>
:root{--bg:#f1f6f4;--card:#fff;--tx:#10211f;--mu:#5a6f6c;--pr:#0f9d8a;--pr2:#ff7a59;--on:#fff;--ok:#12a566;--no:#e5484d;--bd:rgba(16,33,31,.12);--sh:0 8px 24px -14px rgba(16,33,31,.35);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#08110f;--card:#121f1c;--tx:#eaf6f3;--mu:#93aca7;--pr:#2dd4bf;--pr2:#ff8a6b;--on:#04211d;--bd:rgba(255,255,255,.12);--sh:0 8px 24px -14px #000;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#08110f;--card:#121f1c;--tx:#eaf6f3;--mu:#93aca7;--pr:#2dd4bf;--pr2:#ff8a6b;--on:#04211d;--bd:rgba(255,255,255,.12);--sh:0 8px 24px -14px #000;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;overflow-x:hidden}
button{font:inherit;color:inherit;outline:0}
:focus-visible{outline:2px solid var(--pr2);outline-offset:2px}
.w{max-width:720px;margin:0 auto;padding:14px 14px calc(96px + env(safe-area-inset-bottom,0px))}
header{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 14px}
header h1{margin:0;font-size:22px;letter-spacing:-.4px}header small{color:var(--mu);display:block;font-size:12px}
.ic{width:40px;height:40px;border-radius:50%;border:1px solid var(--bd);background:var(--card);cursor:pointer;font-size:18px}
nav{position:fixed;z-index:5;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(440px,calc(100% - 24px));display:grid;grid-template-columns:repeat(4,1fr);padding:5px;border-radius:24px;background:var(--card);border:1px solid var(--bd);box-shadow:0 14px 40px -12px rgba(0,0,0,.4)}
nav .ind{position:absolute;top:5px;bottom:5px;left:5px;width:calc((100% - 10px)/4);border-radius:19px;background:linear-gradient(135deg,var(--pr),var(--pr2));transition:transform .4s cubic-bezier(.3,1.3,.5,1)}
nav button{position:relative;z-index:1;border:0;background:none;padding:8px 0;border-radius:19px;cursor:pointer;font-size:12px;font-weight:600;color:var(--mu);transition:color .25s;overflow:hidden}
nav button b{display:block;font-size:20px;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
nav button.on{color:var(--on)}nav button.on b{transform:translateY(-2px) scale(1.18)}
#m.in,.in{animation:inx .38s cubic-bezier(.2,.8,.2,1) both}
@keyframes inx{from{opacity:0;transform:translateX(var(--d,24px))}to{opacity:1;transform:none}}
.card,details{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.sec{margin:20px 4px 8px;color:var(--mu);font-size:13px;text-transform:uppercase;letter-spacing:.08em}
.bento{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.b,.li,.opt,.cta,.pill{position:relative;overflow:hidden;cursor:pointer;transition:transform .15s,background .25s,border-color .25s,box-shadow .25s}
.b{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:16px;text-align:start;min-height:130px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;box-shadow:var(--sh)}
.b>b{font-size:34px;line-height:1}.b h3{margin:4px 0 0;font-size:18px}.b small,.li small{color:var(--mu)}
.b em{position:absolute;top:12px;right:12px;font-style:normal;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--pr2);color:#fff}
.b.hot{grid-column:1/-1;min-height:150px;background:linear-gradient(135deg,var(--pr),#0b6b73);color:#fff;border:0}
.b.hot small{color:rgba(255,255,255,.85)}
.b.wide{grid-column:1/-1;min-height:90px;flex-direction:row;align-items:center;gap:14px}
.b:active,.li:active,.pill:active,.cta:active,.opt:active:not(:disabled){transform:scale(.96)}
.list .li{display:flex;align-items:center;gap:14px;padding:12px 14px;margin-bottom:8px;background:var(--card);border:1px solid var(--bd);border-radius:18px}
.li>span{font-size:26px}.li>div{flex:1}.li b{display:block}.li i{font-style:normal;font-size:24px;color:var(--mu);transition:transform .25s}
.li:hover i{transform:translateX(5px)}
.pills{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px}
.pill{border:1px solid var(--bd);background:var(--card);border-radius:99px;padding:9px 15px;font-weight:600;white-space:nowrap}
.pill.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.card h2{margin:0 0 6px;font-size:20px}
.card ul{margin:10px 0 0;padding-left:20px}.card li{margin:7px 0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.tile{border:1px solid var(--bd);border-radius:16px;padding:12px;cursor:pointer;font-size:14px;transition:all .3s;background:var(--bg)}
.tile b{display:block;font-size:16px}.tile span{display:none;margin-top:4px}
.tile.on{background:linear-gradient(135deg,var(--pr),var(--pr2));color:var(--on);border:0}.tile.on span{display:block}.tile.on small{display:none}
.tag{font-size:13px;color:var(--mu)}
.bar{height:10px;background:var(--bd);border-radius:9px;overflow:hidden;margin:8px 0 14px}
.bar i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--pr),var(--pr2));transition:width .5s cubic-bezier(.3,1.2,.4,1)}
.opt{display:block;width:100%;text-align:start;margin:10px 0;padding:14px 16px;border-radius:16px;border:2px solid var(--bd);background:var(--card)}
.opt:hover:not(:disabled){border-color:var(--pr)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 20%,var(--card));animation:pop .4s}
.opt.no{border-color:var(--no);background:color-mix(in srgb,var(--no) 20%,var(--card));animation:shake .4s}
.ex{background:var(--bg);border-radius:14px;padding:12px 14px;margin-top:12px;color:var(--mu);font-size:15px;animation:inx .3s both;--d:0px}
.cta{background:linear-gradient(135deg,var(--pr),var(--pr2));color:var(--on);border:0;border-radius:16px;padding:13px 24px;font-weight:700;margin-top:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.big{font-size:64px;text-align:center}.sc{font-size:46px;text-align:center;margin:0;font-weight:800;color:var(--pr)}
details summary{font-weight:700;cursor:pointer;list-style:none;display:flex;gap:8px}
details summary::-webkit-details-marker{display:none}details summary::after{content:"+";margin-inline-start:auto;font-size:22px;color:var(--pr);transition:transform .3s}
details[open] summary::after{transform:rotate(45deg)}
.rp{position:absolute;width:12px;height:12px;margin:-6px;border-radius:50%;background:currentColor;opacity:.22;pointer-events:none;animation:rp .6s ease-out forwards}
.cf{position:fixed;z-index:9;width:10px;height:14px;border-radius:3px;pointer-events:none;animation:conf 1.1s cubic-bezier(.15,.8,.3,1) forwards}
@keyframes rp{to{transform:scale(30);opacity:0}}
@keyframes pop{50%{transform:scale(1.04)}}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(7px)}75%{transform:translateX(-3px)}}
@keyframes conf{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
@media(prefers-reduced-motion:reduce){*,::before,::after{animation:none!important;transition:none!important}}
</style>
</head>

<div class="w"><header><div><h1>🩺 PP Revision Hub</h1><small>Professionalism · ZNU S1 2026-2027</small></div><button class="ic" id="th" aria-label="theme">🌓</button></header><main id="m"></main></div>
<nav id="nav"><i class="ind" id="ind"></i></nav>
<script>
const $=s=>document.querySelector(s),m=$("#m");
const T={P:"Professionalism",B:"Behavior & Classroom",E:"Medical Ethics (4 principles)",H:"Spectrum of Health",S:"Self-Directed Learning"};
// [deck, question, options (first = correct), explanation]
const Q=[
["R","Which of the following is a benefit of self-directed learning?",["Creating a collaborative working environment","Encouraging dependence on teacher/facilitator","Limiting communication skills","Passively following instructions"],"SDL builds soft skills, independence and collaboration."],
["R","What is the exact definition of health?",["A state of complete physical, mental, spiritual and social wellbeing, not merely absence of disease or infirmity","A state of complete physical fitness and mental wellbeing","A state of complete mental, social and spiritual wellbeing","A state of complete physical wellbeing and not merely absence of disease"],"WHO definition: 4 dimensions (physical, mental, spiritual, social) + not merely absence of disease."],
["R","The gap between the current and desired knowledge, skills and abilities is:",["Learning needs","Learning objectives","Learning methods","Learning resources"],"Learning needs = the gap between where you are and where you want to be."],
["R","In self-directed learning, an individual:",["Takes initiative with or without help of others in diagnosing learning needs","Is helpless and dependent","Is passive and waits for directions","Takes initiative without an objective"],"SDL definition: initiative, with or without others, in diagnosing needs, setting goals, choosing resources, evaluating."],
["R","What is the first step in making a learning plan?",["Assess learning needs","Identify learning resources","Identify learning goals","Identify forms of evidence of learning"],"Order: needs → goals → resources → evidence → time frames."],
["R","Which of the following is included in the spectrum of health?",["Positive health","Income","Lifestyle","Socio-cultural component"],"Income, lifestyle and socio-cultural factors are determinants; positive health is on the spectrum."],
["R","Correct order of SDL competency stages?",["Dependent → Interested → Involved → Self-directed","Interested → Dependent → Involved → Self-directed","Dependent → Involved → Interested → Self-directed","Involved → Dependent → Interested → Self-directed"],"Stage 1 dependent, 2 interested, 3 involved, 4 self-directed."],
["P","Medical professionalism is best defined as:",["A set of values, behaviors and relationships that supports public trust in doctors","Only technical and scientific competence","Wearing a white coat and badge","Following hospital rules only"],"It is about how you behave, not only what you know."],
["P","Altruism (patient primacy) means:",["Putting the patient’s interests above personal interests","Ignoring the doctor’s own wellbeing completely","Doing whatever the patient asks","Prioritizing the hospital’s income"],"Patient welfare stays central; personal gain must not compromise it."],
["P","The three fundamental principles of medical professionalism are:",["Patient welfare, patient autonomy, social justice","Honesty, speed, loyalty","Beneficence, privacy, equality","Competence, income, reputation"],"Primacy of patient welfare · Patient autonomy · Social justice."],
["P","A doctor receiving gifts from a drug company that may influence prescribing is an example of:",["Conflict of interest","Altruism","Professional autonomy","Social justice"],"Disclose conflicts and never let them compromise patient welfare."],
["B","In clinical settings, the student’s ID/name badge must be:",["Visibly worn at all times","Worn only in surgery","Optional for students","Shown only on request"],"Clear identification of student status is mandatory."],
["B","When examining a patient of the opposite sex, who must be present?",["A nurse or a student of the same sex as the patient","No one is needed","A relative of the student","Any other patient"],"Same-sex chaperone protects patient dignity."],
["B","Breast, genital or rectal examinations by a student are allowed:",["Only under direct supervision or with a nurse","Alone if the patient agrees","Never, in any case","When the ward is busy"],"Never without direct professional supervision."],
["B","A patient’s religious views that differ from yours should be:",["Respected without debating or questioning them","Challenged politely","Ignored in the report","Discussed to convince the patient"],"Respect religious and moral views at all times."],
["E","A competent Jehovah’s Witness bleeding refuses a blood transfusion. Which principle wins?",["Autonomy","Beneficence","Non-maleficence","Justice"],"Autonomy wins when the patient has capacity, even if the choice leads to death."],
["E","Aggressive chemo that only adds miserable weeks to an incurable patient violates:",["Non-maleficence","Autonomy","Justice","Altruism"],"Harm must not outweigh the benefit."],
["E","Two patients need one liver; who gets it is decided by fair allocation rules. This is:",["Justice","Autonomy","Beneficence","Fidelity"],"Justice = fair distribution of scarce resources."],
["E","Lying to a terminal patient “to protect him” conflicts mainly with:",["Autonomy (right to know the truth)","Justice","Non-maleficence only","Confidentiality"],"Beneficence vs autonomy; deception is rarely justifiable today."],
["H","Illness is best described as:",["The subjective state of feeling unwell","A physiological dysfunction","A social role of the sick person","A lab abnormality"],"Disease = objective dysfunction · Illness = subjective · Sickness = social role."],
["H","Which determinant of health is UN-modifiable?",["Genetic factors","Lifestyle","Education","Physical environment"],"Genes, gender and age are biological; preventive efforts target modifiable ones."],
["H","The spectrum of health emphasizes that health is:",["Dynamic and continuously changing","Static","Only absence of disease","Only physical"],"A process of continuous change."],
["H","“A state of social dysfunction, the role assumed when being ill” defines:",["Sickness","Disease","Illness","Wellness"],"The sickness role."],
["S","In SMART objectives, the T stands for:",["Time limited","Targeted","Tested","Taught"],"Specific · Measurable · Attainable · Realistic · Time limited."],
["S","A student who identifies needs, sets goals and plans actions is at the stage of:",["Involved learner","Dependent learner","Interested learner","Self-directed learner"],"Stage 3 = involved learner."],
["S","Which is NOT a recommended way to assess SDL competencies?",["Memorizing the handout","Self-assessment","Portfolio","Logbook / reflection"],"Self, peer assessment, reflection, logbook and portfolio are recommended."],
["S","Evidence of learning in a learning plan can include:",["Portfolio, case notes, role plays","Only final exam grade","Attendance only","Teacher satisfaction"],"Step 4 of the learning plan."],
["F","Valid consent requires the patient to be:",["Sane, conscious and above 18","Any age if conscious","Above 15 if sane","A relative of the doctor"],"Also understand the nature, purpose and complications; free of fraud, force and fear."],
["F","Consent for a routine physical examination is usually:",["Implied","Expressed written","Expressed oral","Not needed at all"],"Implied consent in routine exams."],
["F","Which procedure needs EXPRESSED WRITTEN consent?",["Examination of alleged sexual assault","Taking a blood sample","IV cannula insertion","Suturing a minor laceration"],"Also operations, general/spinal anesthesia, chemo, new drugs/modalities."],
["F","Which needs only expressed ORAL consent?",["Inserting an IV cannula","Any operation","Radiotherapy","Using a new drug"],"Minor procedures: samples, local anesthesia, catheterization, minor sutures."],
["F","Which consent is INVALID?",["Amputating a finger to escape military service","Consent from a guardian for a minor","Oral consent for blood sampling","Consent explained in simple terms"],"Operation without medical indication = invalid."],
["F","In an emergency like stridor needing tracheostomy, consent is:",["Not necessary","Mandatory in writing","Taken from the neighbors","Taken after 72 hours"],"Surgeons may perform life-saving operations without consent."],
["F","A permissible breach of confidentiality is:",["Notification of infectious diseases (e.g. cholera)","Telling the patient’s employer","Posting the case online","Telling friends for advice"],"Also: patient’s request, for the patient’s sake, doctor’s defense in court, expert witness."],
["F","After the patient’s death, his secret:",["Is not divulged even on request of relatives","Can be told to any relative","Becomes public","Is inherited by the family"],"Secrecy is a personal right, not inheritable."],
["F","Medical records of indoor patients are kept for at least ___ and issued within ___ of request.",["5 years / 72 hours","1 year / 24 hours","10 years / 1 week","2 years / 48 hours"],"Keep ≥5 years; issue within 72 hrs."],
["C","Which is a MODIFIABLE determinant of health?",["Socio-economic factors","Genes","Gender","Age"],"All preventive efforts should target modifiable determinants."],
["C","Wellness vs well-being: well-being emphasizes mainly:",["Mental and emotional health","Physical health only","Income","Genetics"],"Wellness = physical/healthy lifestyle."],
["C","Which group is considered a vulnerable population?",["Homeless and low-income people","Healthy employed adults","Insured executives","Medical students only"],"Also the chronically ill, elderly, uninsured, people with HIV, severe mental disorders."],
["C","Team dynamics refers to:",["Relationships and interactions among members affecting performance","The hospital building","Salary of the team","Number of members only"],"How members communicate, collaborate and coordinate."],
["C","A senior doctor delegates a task to a student; who stays answerable for the outcome?",["The doctor (accountability)","Nobody","Only the student","The patient"],"Responsibility can be delegated; accountability stays with the physician."],
["C","Culture affects health through:",["Beliefs about disease causes and where people seek care","Nothing","Genes only","Hospital size only"],"Perception of illness, pain expression, treatment preferences and adherence."]
];
Q.push(
["P","Which is NOT a main attribute of medical professionalism?",["Maximizing personal income","Altruism","Honor and integrity","Emotional self-awareness"],"Attributes: altruism, compassion, communication, fidelity, lifelong learning, integrity, self-awareness, ethics."],
["P","Fidelity (dedication) means:",["Faithfulness to duties: reliability, confidentiality, commitment to care","Putting patient interests first","Recognizing your own emotions","Fair distribution of resources"],"Fidelity = honoring commitments to patients, colleagues and society."],
["P","“Commitment to honesty with patients” belongs to which principle?",["Patient autonomy","Primacy of patient welfare","Social justice","Professional autonomy"],"Autonomy: honesty, confidentiality, informed decisions."],
["P","“Commitment to a just distribution of finite resources” belongs to:",["Social justice","Patient autonomy","Primacy of patient welfare","Altruism"],"Avoid unnecessary tests and treatments, avoid waste, support fair access."],
["P","Why are medical students considered to be in a position of trust?",["They see confidential information and represent the profession","They are licensed doctors","They are paid by patients","They lead the ward"],"Unprofessional behavior harms public trust and the doctor–patient relationship."],
["P","Exploiting a patient for sexual or financial gain violates:",["Commitment to appropriate relations with patients","Commitment to scientific knowledge","Commitment to access to care","Commitment to quality"],"There is an imbalance of knowledge and power, so boundaries are essential."],
["P","Emotional self-awareness includes:",["Recognizing limitations and seeking help when necessary","Hiding stress completely","Rejecting feedback","Avoiding boundaries"],"Also accepting constructive feedback and managing reactions."],
["B","Academic ethical standards strictly prohibit:",["Plagiarism and falsification of data","Asking questions","Group work","Using the library"],"Honesty and academic integrity apply in academic and clinical activities."],
["B","Eating and mobile phone use in class should be:",["Restricted to designated times and appropriate places","Allowed anytime","Allowed if silent","Only banned in exams"],"Device and facility etiquette."],
["B","Emails and social media with instructors and peers must be:",["Formal and professional","Casual","Anonymous","Only in groups"],"Keep professional boundaries in electronic spaces too."],
["B","In non-surgical clinical settings, students must:",["Fully expose their faces for clear communication","Cover their faces","Avoid eye contact","Wear no badge"],"Accessible communication with patients and staff."],
["B","During a physical examination, exposure of the patient’s body is:",["Restricted to the region relevant to the current phase","Full for convenience","Allowed for training audience","Unlimited with consent"],"Screen and gown the patient to preserve dignity."],
["B","Embarrassing or personal questions to a patient should be asked:",["Privately, not within earshot of others","In the ward round","Loudly for clarity","Through relatives"],"Guarantee privacy in interviews and examinations."],
["B","At the end of a patient contact, the student should:",["Thank the patient and help them dress and return to bed","Leave immediately","Ask for feedback on fees","Take a photo"],"Concluding patient contacts respectfully."],
["E","Beneficence requires:",["Balancing benefits against risks and updating skills","Never treating patients","Avoiding all harm only","Following the family’s wishes"],"Act with the intention of doing good."],
["E","Autonomy requires informed consent with:",["Risks, benefits and alternatives","Only benefits","Only the diagnosis","The family’s opinion"],"Plus mental capacity and respecting refusal."],
["E","Equity differs from equality because equity means:",["Giving people what they need to be healthy","Giving everyone exactly the same","Treating only the rich","Random distribution"],"Equality = same things; equity = what each one needs."],
["E","Bioethics is:",["The study of ethical, social and legal issues in biomedicine and research","A law book","Only hospital policies","A religious doctrine"],"Medical ethics is a branch of bioethics."],
["E","“If the doctor cannot help, at least do not make things worse” describes:",["Non-maleficence","Beneficence","Justice","Autonomy"],"Avoid unnecessary harm and useless treatments."],
["E","Treating similar cases similarly regardless of wealth, race or gender is:",["Justice","Autonomy","Beneficence","Confidentiality"],"Also fair distribution of scarce resources."],
["E","Individuals should never be sacrificed for science. This is a principle of:",["Human dignity","Solidarity","Cooperation","Pluralism"],"Interests of the individual are prior to the sole interest of society."],
["H","Disease is:",["A physiological or psychological dysfunction","A subjective feeling","A social role","A lifestyle"],"Disease = objective deviation from health."],
["H","Wellness describes:",["A healthy lifestyle: eating, activity and sleep","Absence of money problems","Only mental health","A disease state"],"Wellness is more physical; well-being is more mental and emotional."],
["H","Higher income and social class are linked to:",["Better health","Worse health","No effect","Only mental disorders"],"A bigger gap between rich and poor means bigger health differences."],
["H","Education can:",["Compensate the effects of poverty on health","Replace health services","Cause stress","Have no effect"],"Low education is linked with poor health and more stress."],
["H","Rapid population ageing leads to:",["More chronic diseases and disabilities","Fewer diseases","Better services","No change"],"Age is an un-modifiable determinant."],
["H","The political system affects health through:",["Resource allocation, manpower policy and access to services","Genes","Age","Personal hygiene"],"It shapes community health services."],
["H","Culture is best described as:",["A learned way of life shared by a community","A genetic trait","A disease","A law"],"Examples: evil eye, early marriage, circumcision."],
["S","Facilitated learning needs:",["A teacher or facilitator delivering the content","No communication","Only books","Only the internet"],"Face-to-face, online or by email."],
["S","Self-paced learning needs a learner who is:",["Motivated and able to choose suitable resources","Dependent on the teacher","Passive","Unaware of needs"],"The two methods of SDL: facilitated and self-paced."],
["S","The first step to implement SDL is to:",["Assess student readiness","Evaluate effectiveness","Adjust support","Define responsibilities"],"Order: readiness → goals → engage → responsibilities → evaluate → adapt."],
["S","Which is NOT a competency of self-directed learners?",["Passive memorization","Self-awareness","Critical appraisal","Information management"],"Also reflection, critical thinking, teamwork, self and peer evaluation."],
["S","SDL is best described as:",["A set of skills that can be taught, a philosophy not just a strategy","A teaching strategy only","An innate talent","Learning without goals"],"It can be learned and acquired."],
["S","A learner at stage 1 (dependent) is one who:",["Relies on the teacher and has no self-direction","Sets own goals","Evaluates achievements","Is intrinsically motivated"],"Stage 4 is intrinsically motivated with valid resources."],
["S","Which is a performance indicator in education?",["Attendance rate","Hospital income","Number of beds","Dress code"],"Also achievement, satisfaction, retention, graduation rates."],
["F","Consent should be explained in:",["Simple, non-medical terms","Medical terms only","Writing only","Legal terms"],"Informed consent: understandable and freely given."],
["F","Consent for a minor or an insane patient is taken from:",["Parents or guardians","The patient","The nurse","A friend"],"Unconscious patients: next of kin; if absent, urgent treatment in the patient’s best interest."],
["F","The patient has the right to refuse or withdraw consent:",["Any time without giving a reason","Only before surgery","Only with a witness","Only in writing"],"Also consent has limited time and is repeated on re-admission."],
["F","Privacy is the right to:",["Be free from intrusion and decide what is disclosed","Hide all diseases","Refuse examination","Read the records only"],"Confidentiality = not disclosing personal information without sufficient reason."],
["F","Which is NOT a form of confidentiality?",["Financial","Physical","Informational","Associational"],"Physical, informational, decisional and associational."],
["F","The doctor must announce his fees:",["Before rendering the service","After the operation","Only when asked after","Never"],"Fees displayed clearly in the chamber."],
["F","A doctor must notify authorities of:",["Communicable diseases, births, deaths and epidemics","Patient’s salary","Family disputes","Diet choices"],"Notification duty."],
["F","Applying a new treatment on patients is allowed only if it is:",["Properly tested, published and licensed","Popular online","Cheap","Recommended by the patient"],"No trial on patients."],
["F","Sharing a patient’s full-face photo or distinctive tattoo online requires:",["Explicit written consent","No consent","Verbal consent","Hiding the name only"],"All patient data must stay off social media."],
["F","Which is NOT a role of the Medical Syndicate?",["Treating patients in hospitals","Licensing and registration","Investigating malpractice","Setting rules and duties"],"It can warn, retrain, suspend or withdraw licenses."],
["F","Responsibility vs accountability: accountability is:",["Being answerable for the outcome","The duty to perform a task","Delegable to a student","Backward looking only for students"],"Responsibility is forward-looking and delegable."],
["C","War, crime and discrimination are examples of which cause of vulnerability?",["Social","Biological","Environmental","Cultural"],"Biological: ageing; environmental: disasters; cultural: traditions."],
["C","A team is defined as two or more people who:",["Interact interdependently toward a common goal","Work alone","Share the same job","Have unlimited membership"],"They have assigned roles and a limited lifespan."],
["C","Separate electronic records and lack of time are:",["Structural barriers to cooperation","Cultural barriers","Interpersonal barriers","Not barriers"],"Cultural: medical dominance; interpersonal: poor communication, fear of conflict."],
["C","Care for vulnerable populations includes:",["Prevention focus and coordinated services","Ignoring prevention","Charging more","Limiting access"],"Example: medical convoys."],
["C","Stigmatization is:",["A social rather than a legal concept","A legal concept only","A medical test","A treatment"],"Often used by WHO for HIV and mental health."],
["C","Pluralism means:",["Treating people as equal citizens irrespective of differences","Having one culture","Separating groups","Ignoring beliefs"],"Affirmation and acceptance of diversity."]
);
Q.push(
["K","Case: A conscious, competent adult is bleeding after an accident. As a Jehovah’s Witness he refuses a blood transfusion. What is the best action?",["Respect the refusal, confirm capacity, offer alternatives and document","Transfuse him anyway to save his life","Ask his relatives to decide","Wait until he becomes unconscious"],"Autonomy wins when the patient has capacity, even if the choice leads to death."],
["K","Case: A student posts a photo of a patient’s distinctive tattoo (no face) on Instagram to show an interesting case. This is:",["A breach of confidentiality; delete it and inform the supervisor","Acceptable because the face is hidden","Acceptable if the post is private","Acceptable if no name is written"],"Identifying features need explicit written consent; patient data stays off social media."],
["K","Case: A busy resident asks a student to do a rectal examination on a female patient alone because the nurse is away. The student should:",["Politely refuse and wait for supervision or a nurse","Do it quickly","Ask another student to watch from outside","Do it if the patient agrees"],"Sensitive examinations need direct supervision or a nurse, with a same-sex chaperone."],
["K","Case: An unconscious patient arrives with a head injury needing urgent surgery. Next of kin cannot be reached. The surgeon should:",["Operate without consent, in the patient’s best interest","Wait until the family arrives","Ask the police for consent","Refuse to operate"],"Emergency: consent is not necessary for life-saving operations."],
["K","Case: A relative phones asking for a patient’s test results; the patient has not given permission. The doctor should:",["Refuse to disclose without the patient’s consent","Tell him since he is family","Tell him only the diagnosis","Send the report by email"],"Confidentiality continues unless a permissible breach exists."],
["K","Case: A 16-year-old needs a non-emergency operation and wants to sign the consent himself. Valid consent must come from:",["His parent or guardian","The boy himself","His school","Any adult nearby"],"Below 18 is not competent; parents or guardians consent."],
["K","Case: A family begs the doctor not to tell an elderly patient he has terminal cancer. The best approach is:",["Tell the patient honestly with support, respecting autonomy","Hide the diagnosis permanently","Lie about it","Tell only the family"],"Deceiving a patient to protect him is rarely ethically justifiable."],
["K","Case: A patient with incurable cancer is receiving aggressive chemo that adds only weeks of severe suffering. Which principle suggests reconsidering?",["Non-maleficence","Justice","Autonomy only","Fidelity"],"Harm must not outweigh the benefit; consider palliative care with the patient."],
["K","Case: Two patients need one liver; one is a 30-year-old mother, the other a 65-year-old waiting longer. The decision should be based on:",["Fair allocation criteria, free from personal bias","The doctor’s personal preference","Who can pay more","Who is more famous"],"Justice: separate bedside care from resource allocation rules."],
["K","Case: A restaurant cook is diagnosed with typhoid. The doctor may:",["Notify public health authorities, a permissible breach","Keep it absolutely secret","Tell his customers directly","Tell his neighbors"],"Breach is allowed for the sake of the public: notifiable diseases."],
["K","Case: A surgeon convinces a patient that surgery is needed to save his life, but it is not. The consent is:",["Invalid, obtained by fraud","Valid because it is signed","Valid because he agreed","Valid if oral"],"Consent under fraud, force or fear is invalid."],
["K","Case: The police ask a doctor to examine a suspect and report the findings to the court. Disclosure is:",["Permissible: expert witness","A breach of confidentiality","Allowed only if the suspect agrees","Not allowed at all"],"Facts found must be included in the report or given in court."],
["K","Case: A village has unsafe water, low education and high unemployment. Preventive efforts should mainly target:",["Modifiable determinants: socio-economic and environmental","Un-modifiable determinants only","Genes","Age only"],"All preventive efforts target modifiable determinants."]
);
const D={all:["🌈","Mixed 5 topics"],R:["📝","Exam-style (your file)"],F:["⚖️","Forensic (10 marks)"],C:["🌍","Community"],P:["🧭",T.P],B:["🎓",T.B],E:["🤝",T.E],H:["📈",T.H],S:["🧠",T.S],K:["🧪","Cases (scenario MCQs)"]};
const SUM=[
["🧭","Concepts & attributes of professionalism",["Definition: values, behaviors and relationships that support public trust in doctors.","Attributes: altruism, compassion, communication, fidelity, lifelong learning, honor & integrity, emotional self-awareness, ethics.","3 principles: patient welfare · autonomy · social justice.","Welfare commitments: competence, quality of care, appropriate relations, scientific knowledge, managing conflicts of interest.","Students are in a position of trust and represent the profession."]],
["🎓","Student behavior & classroom ethics",["Academic: honesty, no plagiarism or data falsification, follow rules, respect facilities.","Classroom: punctuality, attendance, polite communication, food and phone only at proper times.","Digital: emails and social media stay formal and professional.","Clinical: dress code, hygiene, visible badge, face exposed (non-surgical), same-sex chaperone.","Sensitive exams only with supervision; thank the patient at the end."]],
["🤝","Medical ethics (4 principles)",null],
["📈","Spectrum of health",["Health (WHO 1984): complete physical, mental, spiritual and social well-being, not merely absence of disease.","Disease = objective dysfunction · Illness = subjective · Sickness = social role.","Spectrum: health is dynamic, continuously changing.","Un-modifiable: genes, gender, age. Modifiable (target of prevention): lifestyle, income, education, occupation, health services, environment, social support, politics.","Culture shapes beliefs, pain expression, help-seeking and adherence."]],
["🧠","Self-directed learning",["SDL: take initiative, with or without help, to diagnose needs, set goals, find resources, choose strategies, evaluate.","Methods: facilitated learning · self-paced learning.","Learning plan: needs → goals (SMART) → resources → evidence → time frames.","4 stages: dependent → interested → involved → self-directed.","Assess via self/peer assessment, reflection, logbook, portfolio."]]
];
const CASES=[
["Refusal of blood","A conscious, competent adult is bleeding after an accident. He is a Jehovah’s Witness and refuses a transfusion.","Respect the refusal (autonomy) after making sure he has capacity and understands the risks; offer alternatives and document everything."],
["Instagram photo","A student posts a photo of a patient’s distinctive tattoo from the ward, without the face, to show an interesting case.","Breach of confidentiality: identifying features need explicit written consent. Delete the post and report to the supervisor."],
["Alone with a rectal exam","A busy resident asks a student to do a rectal examination on a female patient alone, because the nurse is away.","Politely refuse. Sensitive exams need direct supervision or an accompanying nurse, plus a same-sex chaperone."],
["Unconscious patient","An unconscious patient arrives with a head injury and needs urgent surgery; next of kin cannot be reached.","Emergency: consent is not necessary. Operate in the patient’s best interest, and document why."],
["Wife asks for the diagnosis","A patient’s relative calls asking for the test results, without the patient’s permission.","Confidentiality: do not disclose without patient consent, unless a permissible breach exists (e.g. a notifiable disease)."]
];
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const best=JSON.parse((()=>{try{return localStorage.getItem("pp")||"{}"}catch(e){return"{}"}})());
const save=()=>{try{localStorage.setItem("pp",JSON.stringify(best))}catch(e){}};
const order=["home","sum","quiz","cases"],tabs={home:["🏠","Home"],sum:["📚","Learn"],quiz:["🎯","Quiz"],cases:["🧪","Cases"]},SN=["Professionalism","Behavior","Ethics","Health","SDL"];
let tab="home",run=null,si=0,prev=0;
const n=k=>Q.filter(q=>k=="all"||q[0]==k).length,bs=k=>best[k]!=null?` · 🏆 ${best[k]}%`:"";
function anim(el,d){el=el||m;el.style.setProperty("--d",(d||1)*26+"px");el.classList.remove("in");void el.offsetWidth;el.classList.add("in")}
$("#nav").insertAdjacentHTML("beforeend",order.map(k=>`<button data-k="${k}"><b>${tabs[k][0]}</b>${tabs[k][1]}</button>`).join(""));
$("#nav").onclick=e=>{const k=e.target.closest("button")?.dataset.k;if(k){tab=k;run=null;draw()}};
function draw(){const i=order.indexOf(tab);$("#ind").style.transform=`translateX(${i*100}%)`;document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.k==tab));({home,sum,quiz,cases})[tab]();anim(m,i>=prev?1:-1);prev=i;scrollTo(0,0)}
const pick=e=>{const d=e.target.closest("[data-d]");if(d)start(d.dataset.d)};
function home(){m.innerHTML=`<div class="bento"><div class="b hot" data-d="F"><em>10 marks</em><b>⚖️</b><h3>Forensic</h3><small>${n("F")} Qs${bs("F")}</small></div><div class="b" data-d="C"><b>🌍</b><h3>Community</h3><small>${n("C")} Qs${bs("C")}</small></div><div class="b" data-d="R"><b>📝</b><h3>Exam-style</h3><small>${n("R")} Qs${bs("R")}</small></div><div class="b wide" data-d="all"><b>🌈</b><div><h3>Mixed</h3><small>${n("all")} Qs from all topics${bs("all")}</small></div></div></div><div class="sec">By topic</div><div class="list">`+["P","B","E","H","S"].map(k=>`<div class="li" data-d="${k}"><span>${D[k][0]}</span><div><b>${D[k][1]}</b><small>${n(k)} Qs${bs(k)}</small></div><i>›</i></div>`).join("")+`</div>`;m.onclick=pick}
function sum(){m.innerHTML=`<div class="pills">`+SUM.map((x,i)=>`<button class="pill ${i==si?"on":""}" data-i="${i}">${x[0]} ${SN[i]}</button>`).join("")+`</div><div id="pn"></div>`;panel();m.onclick=e=>{const p=e.target.closest(".pill");if(p){const i=+p.dataset.i,d=i>=si?1:-1;si=i;document.querySelectorAll(".pill").forEach((x,j)=>x.classList.toggle("on",j==i));panel();anim($("#pn"),d);return}const t=e.target.closest(".tile");if(t)t.classList.toggle("on")}}
function panel(){const[i,t,l]=SUM[si];$("#pn").innerHTML=`<div class="card"><h2>${i} ${t}</h2>`+(l?`<ul dir="auto">${l.map(x=>`<li>${x}</li>`).join("")}</ul>`:`<p class="tag">Tap each principle</p><div class="tiles">`+[["Autonomy","Self-rule. Informed consent, capacity, respect refusal."],["Beneficence","Act to do good: effective treatment, benefit > risk."],["Non-maleficence","Do no harm: stop useless or harmful treatment."],["Justice","Fair distribution: equality vs equity, scarce resources."]].map(([a,b])=>`<div class="tile"><b>${a}</b><span>${b}</span><small class="tag">tap</small></div>`).join("")+`</div>`)+`</div>`}
function quiz(){m.innerHTML=`<div class="sec" style="margin-top:4px">Choose a deck</div><div class="list">`+Object.entries(D).map(([k,[i,t]])=>`<div class="li" data-d="${k}"><span>${i}</span><div><b>${t}</b><small>${n(k)} Qs${bs(k)}</small></div><i>›</i></div>`).join("")+`</div>`;m.onclick=pick}
function start(k){tab="quiz";run={k,qs:shuf(Q.filter(q=>k=="all"||q[0]==k)).map(q=>({q:q[1],o:shuf(q[2].map((t,i)=>({t,c:i==0}))),e:q[3]})),i:0,s:0,w:[]};document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.k=="quiz"));$("#ind").style.transform="translateX(200%)";prev=2;ask(1)}
function ask(d){const r=run,q=r.qs[r.i];if(!q)return fin();
m.innerHTML=`<div class="row tag"><span>${D[r.k][0]} ${D[r.k][1]}</span><span>${r.i+1}/${r.qs.length} · ✅ ${r.s}</span></div><div class="bar"><i id="pb" style="width:${r.i/r.qs.length*100}%"></i></div><div class="card"><h3 dir="auto" style="margin-top:0">${q.q}</h3><div id="o">`+q.o.map((o,i)=>`<button class="opt" dir="auto" data-i="${i}">${o.t}</button>`).join("")+`</div><div id="f"></div></div>`;anim(m,d);requestAnimationFrame(()=>$("#pb").style.width=(r.i+1)/r.qs.length*100+"%");
$("#o").onclick=e=>{const b=e.target.closest(".opt");if(!b||b.disabled)return;const ok=q.o[b.dataset.i].c;
document.querySelectorAll(".opt").forEach((x,i)=>{x.disabled=true;if(q.o[i].c)x.classList.add("ok")});
if(ok){r.s++;burst(b,16)}else{b.classList.add("no");r.w.push(q)}
$("#f").innerHTML=`<div class="ex" dir="auto">${ok?"🎉 Correct! ":"❌ Not quite. "}${q.e}</div><button class="cta" id="n">${r.i+1<r.qs.length?"Next →":"Finish 🏁"}</button>`;
$("#n").onclick=()=>{r.i++;ask(1)}}}
function fin(){const r=run,p=Math.round(r.s/r.qs.length*100);if(best[r.k]==null||p>best[r.k]){best[r.k]=p;save()}
m.innerHTML=`<div class="card"><div class="big">${p>=85?"🏆":p>=60?"👏":"💪"}</div><h2 class="sc" style="text-align:center"><span id="cn">0</span>%</h2><p class="tag" style="text-align:center">${r.s} / ${r.qs.length} correct · ${p>=85?"ممتاز! جاهز للامتحان":p>=60?"كويس، راجع الغلط":"كمل مذاكرة وجرب تاني"}</p><div class="row" style="justify-content:center"><button class="cta" id="a">🔁 Again</button>${r.w.length?`<button class="cta" id="w">🔍 Retry mistakes (${r.w.length})</button>`:""}</div></div>`;anim(m,1);cnt(p);if(p>=60)burst(null,70);
$("#a").onclick=()=>start(r.k);
if(r.w.length)$("#w").onclick=()=>{run={k:r.k,qs:shuf(r.w.map(q=>({...q,o:shuf(q.o)}))),i:0,s:0,w:[]};ask(1)}}
function cases(){m.innerHTML=`<div class="card"><div class="big">🧪</div><h2 style="text-align:center;margin:0">Case MCQs</h2><p class="tag" style="text-align:center" dir="auto">${n("K")} scenario-based questions on consent, confidentiality, ethics and community health${bs("K")}</p><div class="row" style="justify-content:center"><button class="cta" data-d="K">Start cases 🚀</button></div></div>`;m.onclick=pick}
function burst(el,n){const b=el?el.getBoundingClientRect():{left:innerWidth/2,top:innerHeight/3,width:0,height:0},cx=b.left+b.width/2,cy=b.top+b.height/2,c=["#0f9d8a","#ff7a59","#ffd166","#12a566","#8ecae6"];for(let i=0;i<n;i++){const d=document.createElement("i");d.className="cf";d.style.cssText=`left:${cx}px;top:${cy}px;background:${c[i%5]};--x:${(Math.random()-.5)*(n>30?700:260)}px;--y:${(Math.random()-.7)*(n>30?600:240)}px;--r:${Math.random()*720}deg`;document.body.appendChild(d);setTimeout(()=>d.remove(),1200)}}
function cnt(p){let v=0;const e=$("#cn"),t=setInterval(()=>{v+=Math.max(1,Math.round(p/30));if(v>=p){v=p;clearInterval(t)}e&&(e.textContent=v)},25)}
document.addEventListener("pointerdown",e=>{const t=e.target.closest(".opt,.cta,.b,.li,.pill,#nav button");if(!t||t.disabled)return;const r=t.getBoundingClientRect(),x=document.createElement("span");x.className="rp";x.style.cssText=`left:${e.clientX-r.left}px;top:${e.clientY-r.top}px`;t.appendChild(x);setTimeout(()=>x.remove(),600)});
$("#th").onclick=()=>{const d=document.documentElement,dk=d.dataset.theme?d.dataset.theme=="dark":matchMedia("(prefers-color-scheme:dark)").matches;d.dataset.theme=dk?"light":"dark"};
draw();
</script>
</body>
</html>
